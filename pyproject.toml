[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agilis-ads"
dynamic = ["version"]
description = "The official Python SDK for the Agilis Advertising REST API: Offers, Events and webhooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Agilis Dating Ltd", email = "help@agilis.dating" }]
keywords = ["agilis", "advertising", "api", "sdk", "offers", "events", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/agilisdating/agilis-ads-python"
Documentation = "https://www.agilis.dating/api-doc"
Source = "https://github.com/agilisdating/agilis-ads-python"
Issues = "https://github.com/agilisdating/agilis-ads-python/issues"
Changelog = "https://github.com/agilisdating/agilis-ads-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/agilis_ads/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agilis_ads"]

[tool.hatch.build.targets.sdist]
include = [
    "src/agilis_ads",
    "tests",
    "examples",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "S", "SIM", "RUF"]
ignore = [
    "UP006",  # keep typing.Dict/List for readability in TypedDicts
    "UP007",  # Optional/Union read clearly in public signatures
    "UP035",
    "UP045",
    "RUF022",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"src/agilis_ads/__init__.py" = ["A004"]
"src/agilis_ads/_client.py" = ["A004"]
"tests/**" = ["S101", "S105", "S106", "S311"]
"examples/**" = ["S104"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs against the API in Test mode (needs AGILIS_TEST_API_KEY)"]
addopts = "-m 'not integration'"
